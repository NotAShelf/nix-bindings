[package]
name                   = "nix-bindings"
description            = "Rust binding for Nix, the build tool"
edition.workspace      = true
version.workspace      = true
repository.workspace   = true
rust-version.workspace = true
license.workspace      = true
publish                = true
documentation          = "https://notashelf.github.io/nix-bindings/nix_bindings"
readme                 = "./README.md"

[package.metadata.docs.rs]
no-default-features = true
targets             = [ "x86_64-unknown-linux-gnu" ]

[features]
default = [ "full" ]
full = [
  "nix-bindings-sys/full",
  "store",
  "expr",
  "util",
  "flake",
  "main",
  "external",
  "primop",
  "shim",
]

expr     = [ "store", "nix-bindings-sys/expr" ]
external = [ "expr" ]
flake    = [ "expr", "nix-bindings-sys/flake" ]
main     = [ "util", "nix-bindings-sys/main" ]
primop   = [ "expr", "nix-bindings-sys/expr" ]
shim     = [ "nix-bindings-sys/shim", "expr" ]
store    = [ "util", "nix-bindings-sys/store" ]
util     = [ "nix-bindings-sys/util" ]

[dependencies]
nix-bindings-sys = { default-features = false, workspace = true }

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace    = true
