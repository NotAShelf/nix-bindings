name: "Run Tests"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "nix-bindings/**"
      - "nix-bindings-sys/**"
      - "flake.nix"
      - "flake.lock"
      - "shell.nix"
      - ".github/workflows/test.yml"
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "nix-bindings/**"
      - "nix-bindings-sys/**"
      - "flake.nix"
      - "flake.lock"
      - "shell.nix"
      - ".github/workflows/test.yml"

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # TODO: maybe enter shell once and run the commands in there...
      - name: Build workspace and examples
        run: nix develop --command cargo build --locked --workspace --all-features --all-targets

      - name: Run workspace tests
        run: nix develop --command cargo nextest run --locked --workspace --all-features

      - name: Run linked Nix library smoke test
        run: nix develop --command cargo run --locked -p nix-bindings-sys --example version
